name: Deploy demonstration
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check presentation-only file boundary
        shell: python
        run: |
          import json, pathlib, struct, subprocess
          expected = {
              '.github/workflows/deploy-pages.yml', '.gitignore', 'AGENTS.md',
              'README.md', 'serve.py', 'ATTRIBUTION.md', 'LICENSES/fly-brain-MIT.txt', 'docs/NAMING.md',
              'dist/index.html', 'dist/v3.html', 'dist/app.js', 'dist/style.css',
              'dist/model-network.css', 'dist/visual-polish.css', 'dist/demo.css',
              'dist/favicon.svg', 'dist/media/d3.mp4', 'dist/media/d4.mp4',
              'dist/model-network.js', 'dist/odor-field.js', 'dist/media/odor-field.png',
              'dist/media/d3-display.json', 'dist/media/d4-display.json',
              'dist/media/d3-appearance.png', 'dist/media/d4-appearance.png',
          }
          tracked = set(subprocess.check_output(['git','ls-files','-z']).decode().strip('\0').split('\0'))
          actual = {str(p) for p in pathlib.Path('.').rglob('*') if p.is_file() and '.git' not in p.parts}
          assert tracked == expected, f'Unexpected tracked files: {tracked ^ expected}'
          assert actual == expected, f'Unexpected packaged files: {actual ^ expected}'
          for name in expected:
              p = pathlib.Path(name)
              assert not p.is_symlink(), name
              if p.suffix == '.mp4':
                  assert p.read_bytes()[4:8] == b'ftyp', name
              elif p.suffix == '.png':
                  assert p.read_bytes()[:8] == b'\x89PNG\r\n\x1a\n', name
              else:
                  content = p.read_text()
                  for forbidden in ['weights.f32','policy.f32','vision.f32','metadata.json',
                                    'checkpointSha256','recordingSha256','credential','replays-20261015',
                                    'agreementMaxAbsError','parameterUpdates','optimizer','state_dict']:
                      assert forbidden not in content or name == '.github/workflows/deploy-pages.yml', name
          common = {'format','difficulty','frames','stepDtSeconds','hexUV','positionsXYZCm','distanceCm',
                    'actions','topdownMarkerXY','obstaclePositionsXYCm','obstacleRadiiCm','sourcePositionXYCm','sensorOffsets','networkLayout'}
          optional = {'goalPositionsXYCm','activeGoal','odorConcentrations','odorFeatures'}
          for task, frames in [('d3',187),('d4',408)]:
              scene = json.loads(pathlib.Path(f'dist/media/{task}-display.json').read_text())
              assert set(scene) == common | (optional if task == 'd4' else {'goalMarkerSegmentXYCm'})
              assert scene['format'] == 'presentation-v2' and scene['frames'] == frames
              assert len(scene['positionsXYZCm']) == len(scene['actions']) == len(scene['distanceCm']) == frames
              assert all(len(p)==3 and all(round(v,2)==v for v in p) for p in scene['positionsXYZCm'])
              assert all(len(p)==3 and all(round(v,3)==v for v in p) for p in scene['actions'])
              assert len(scene['topdownMarkerXY']) == frames
              assert all(len(p)==2 and all(round(v,1)==v and 0<=v<limit for v,limit in zip(p,(1280,720))) for p in scene['topdownMarkerXY'])
              layout = scene['networkLayout']
              assert set(layout) == {'format','sampledNodesPerEye','fullNodesPerEye','cellTypes','layers','nodes','edges','appearance','imageWidth','imageHeight','rowsPerFrame'}
              assert layout['format'] == 'rendered-rgba-v1'
              assert all(set(t)=={'name','count','role'} for t in layout['cellTypes'])
              assert all(set(l)=={'id','width','title'} for l in layout['layers'])
              if task == 'd3':
                  assert [l['width'] for l in layout['layers']] == [144,17,17,17,3]
                  assert len(scene['goalMarkerSegmentXYCm']) == 2
                  assert all(len(p)==2 and all(round(v,2)==v for v in p) for p in scene['goalMarkerSegmentXYCm'])
              assert all(len(n)==9 and isinstance(n[0],str) for n in layout['nodes'])
              assert all(len(e)==2 and all(isinstance(i,int) and 0<=i<len(layout['nodes']) for i in e) for e in layout['edges'])
              assert set(scene['sensorOffsets']) == {'hexVisual','hexActivity','eyes','eyeSize'}
              size=scene['sensorOffsets']['eyeSize']
              assert layout['imageHeight'] == layout['rowsPerFrame']*frames + ((frames*2 + layout['imageWidth']//size - 1)//(layout['imageWidth']//size))*size
              png = pathlib.Path(f'dist/media/{task}-appearance.png').read_bytes()
              width,height,depth,color = struct.unpack('>IIBB',png[16:26])
              assert (width,height,depth,color) == (layout['imageWidth'],layout['imageHeight'],8,6)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
